name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix XML files
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:label="Мои карты"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.coordinatorlayout.widget.CoordinatorLayout 
              xmlns:android="http://android.com"
              xmlns:app="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F5F5F5">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="16dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Мои карты"
                      android:textSize="28sp"
                      android:textStyle="bold"
                      android:textColor="#212121"
                      android:layout_marginBottom="16dp"/>
                  <ListView
                      android:id="@+id/cardsListView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:divider="@android:color/transparent"
                      android:dividerHeight="10dp"/>
              </LinearLayout>
              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/addCardFab"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|end"
                  android:layout_margin="24dp"
                  app:srcCompat="@android:drawable/ic_input_add"
                  app:tint="@android:color/white"/>
          </androidx.coordinatorlayout.widget.CoordinatorLayout>
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoyaltyCards-APK
          path: app/build/outputs/apk/debug/app-debug.apk
